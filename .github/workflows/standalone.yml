name: Standalone artifacts (manual, no publishing)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install . pyinstaller==6.16.0
      - run: python -m PyInstaller --onefile --name ocu --collect-all opencode_usage src/opencode_usage/standalone.py
      - run: python -c "import pathlib,subprocess; p=next(pathlib.Path('dist').glob('ocu*')); subprocess.run([str(p.resolve()),'--version'],check=True)"
      - run: python -c "import hashlib,pathlib; p=pathlib.Path('dist'); (p/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name+'\n' for f in sorted(p.glob('ocu*'))),encoding='utf-8')"
      - uses: actions/upload-artifact@v4
        with:
          name: ocu-${{ matrix.os }}
          path: dist/*
