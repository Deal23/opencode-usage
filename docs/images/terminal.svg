<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-label="OCU 终端主菜单示例">
  <rect width="1000" height="490" rx="18" fill="#111827"/>
  <rect x="24" y="20" width="952" height="450" rx="12" fill="#172033" stroke="#35415a"/>
  <g font-family="Menlo, Consolas, 'PingFang SC', monospace" font-size="20" fill="#d9e2f2">
    <text x="52" y="62" font-weight="700" fill="#7dd3fc">OCU  /  OpenCode 用量</text>
    <text x="52" y="99">设备  示例设备    ·    v0.1.5</text>
    <text x="52" y="132" fill="#a5b4ca">报告 10/31 12:00 · 120 条 · 3.2M token</text>
    <path d="M52 151 H948" stroke="#35415a"/>
    <text x="52" y="193" font-weight="700">[1] 刷新</text><text x="270" y="193">更新统计并导出快照</text>
    <text x="52" y="230">[2] 数据</text><text x="270" y="230">导入、同步与 CSV</text>
    <text x="52" y="267">[3] 会话</text><text x="270" y="267">进入、重命名与删除</text>
    <text x="52" y="304">[4] 设置</text><text x="270" y="304">偏好、报表与更新</text>
    <text x="52" y="361" fill="#a5b4ca">[v] 可视化报告</text><text x="320" y="361" fill="#a5b4ca">[t] 文档报告（分页按 q 返回）</text>
    <text x="52" y="398" fill="#a5b4ca">[?] 帮助</text><text x="320" y="398" fill="#a5b4ca">[0] 退出</text>
    <path d="M52 420 H948" stroke="#35415a"/>
    <text x="52" y="453" fill="#7dd3fc">› 选择 [0-4/v/t/?]：</text>
  </g>
</svg>
